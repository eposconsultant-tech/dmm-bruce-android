plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('DMM_RELEASE_STORE_FILE')
def releaseKeystorePassword = System.getenv('DMM_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('DMM_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('DMM_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'uk.aigoat.dmmdriver'
    compileSdk 35

    defaultConfig {
        applicationId "uk.aigoat.dmmdriver"
        minSdk 23
        targetSdk 35
        versionCode 29
        versionName "3.29"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
}
