name: Build DMM Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DMM-Driver-v3.12.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMM-Driver-v3.12
          path: DMM-Driver-v3.12.apk
      - name: Publish latest test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dmm-driver-latest --cleanup-tag --yes || true
          gh release create dmm-driver-latest DMM-Driver-v3.12.apk \
            --title "DMM Driver v3.12" \
            --notes "Paired with safe Portal v2.19.01. Builds from proven v3.11 and keeps login/input architecture intact. Adds atomic Delivered verification on SQLite persistence, avoids dmmJobsV3 browser quota writes inside APK, native LOCAL READY TO SEND / ALL SYNCED diagnostics, non-blocking saved-offline completion message, and camera/photo chooser permission handling. No PortalAdapter or DOM mutation observer."
      - name: Record successful build
        run: |
          printf 'DMM Driver v3.12\nBuilt from commit: %s\nWorkflow run: %s\nRelease tag: dmm-driver-latest\nAPK: DMM-Driver-v3.12.apk\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > LATEST_APK_BUILD.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_APK_BUILD.txt
          git commit -m "[skip ci] Record successful DMM Driver APK build" || exit 0
          git push
