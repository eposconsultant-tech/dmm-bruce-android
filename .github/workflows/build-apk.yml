name: Build DMM Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DMM-Driver-v2.0-live-cloud.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMM-Driver-v2.0-live-cloud
          path: DMM-Driver-v2.0-live-cloud.apk

      - name: Publish latest test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dmm-driver-latest --cleanup-tag --yes || true
          gh release create dmm-driver-latest DMM-Driver-v2.0-live-cloud.apk \
            --title "DMM Driver v2.0 Live Cloud" \
            --notes "Driver test APK linked to https://dmm.aigoat.uk and the live Supabase-backed DMM portal."
