name: Build DMM Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DMM-Driver-v3.04.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMM-Driver-v3.04
          path: DMM-Driver-v3.04.apk
      - name: Publish latest test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dmm-driver-latest --cleanup-tag --yes || true
          gh release create dmm-driver-latest DMM-Driver-v3.04.apk \
            --title "DMM Driver v3.04" \
            --notes "Paired with Portal v2.18.39. SQLite v2 offline persistence, AiGOAT launcher identity, pending-data diagnostics/counts, completed-job visibility toggle, authoritative auto-download on driver login, and legacy cache cleanup."
      - name: Record successful build
        run: |
          printf 'DMM Driver v3.04\nBuilt from commit: %s\nWorkflow run: %s\nRelease tag: dmm-driver-latest\nAPK: DMM-Driver-v3.04.apk\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > LATEST_APK_BUILD.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_APK_BUILD.txt
          git commit -m "[skip ci] Record successful DMM Driver APK build" || exit 0
          git push
