name: Build DMM Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "v2.1-offline-sqlite-final" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DMM-Driver-v2.1-offline-sqlite.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMM-Driver-v2.1-offline-sqlite
          path: DMM-Driver-v2.1-offline-sqlite.apk

      - name: Publish v2.1 offline test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dmm-driver-v2.1-offline --cleanup-tag --yes || true
          gh release create dmm-driver-v2.1-offline DMM-Driver-v2.1-offline-sqlite.apk \
            --title "DMM Driver v2.1 Offline SQLite" \
            --notes "Offline-first test APK for https://dmm.aigoat.uk. Downloads selected-day driver jobs into local SQLite, stores offline photo/signature/required-data/audit completion changes, and uploads queued job updates back to the live Supabase-backed DMM portal."

      - name: Record successful build
        run: |
          printf 'DMM Driver v2.1 Offline SQLite\nBuilt from commit: %s\nWorkflow run: %s\nRelease tag: dmm-driver-v2.1-offline\nAPK: DMM-Driver-v2.1-offline-sqlite.apk\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > LATEST_APK_BUILD.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_APK_BUILD.txt
          git commit -m "[skip ci] Record successful DMM Driver v2.1 APK build" || exit 0
          git push
